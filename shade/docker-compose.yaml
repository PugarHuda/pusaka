# The image is built by .github/workflows/shade-image.yml; pin it by digest after the first build.
services:
  pusaka-agent:
    environment:
      AGENT_CONTRACT_ID: ${AGENT_CONTRACT_ID}
      SPONSOR_ACCOUNT_ID: ${SPONSOR_ACCOUNT_ID}
      SPONSOR_PRIVATE_KEY: ${SPONSOR_PRIVATE_KEY}
    platform: linux/amd64
    image: ghcr.io/pugarhuda/pusaka-agent:latest
    container_name: pusaka-agent
    ports:
      - 3000:3000
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
    restart: always
