name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 */6 * * *" # e2e also watches the live deployment

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: contract }
      - run: cargo test
        working-directory: contract
      - run: cargo test --features mainnet   # the mainnet build: light client, confirmations, chain allowlist
        working-directory: contract

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node shared/ckd.test.mjs   # CKD client vs near/mpc test vectors
      - run: npm run lint   # node code (api, shared, mcp, scripts, shade) and web, no-undef on
      - run: npm run build -w web
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -w web
      - run: node mcp/remote-smoke.mjs
      - run: npm run smoke -w mcp   # local MCP server; guards refuse before signing (throwaway key)
