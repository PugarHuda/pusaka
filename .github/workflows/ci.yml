name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *" # e2e also watches the live deployment, daily (Actions minutes are capped while the repo is private)

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: contract }
      - run: cargo test
        working-directory: contract
      - run: cargo test --features mainnet   # the mainnet build: light client, confirmations, chain allowlist
        working-directory: contract
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-audit }
      - run: cargo audit   # RustSec advisories for every crate in Cargo.lock
        working-directory: contract

  # NEP-330: the wasm deployed to pusaka-btc.testnet comes from here; anyone can rebuild it with
  # `cargo near verify` / the same image and compare the hash.
  reproducible-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh
      - run: cargo near build reproducible-wasm
        working-directory: contract
      - run: sha256sum contract/target/near/pusaka.wasm | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: pusaka-wasm, path: contract/target/near/pusaka.wasm }

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node shared/ckd.test.mjs   # CKD client vs near/mpc test vectors
      - run: node shared/prices.test.mjs   # LTV guard prices need two agreeing sources
      - run: node shared/esplora.test.mjs  # Bitcoin reads fail over mempool.space -> Blockstream
      - run: node shared/failover.test.mjs  # NEAR reads skip a rate-limited RPC; a contract panic is not retried
      - run: node shared/intents.test.mjs  # NEAR Intents exit quote: dry run only, refusals keep their reason
      - run: node api/_prices.test.mjs  # a price-source failure serves the last good answer, marked stale
      - run: node api/_relayer.test.mjs  # gas-free loan acceptance only when the contract would take it
      - run: node web/src/errors.test.mjs  # contract panic codes read as sentences, unknown ones pass through
      - run: node web/src/ics.test.mjs  # calendar reminders are valid RFC 5545 (CRLF, folding, escaping, alarm)
      - run: npm run lint   # node code (api, shared, mcp, scripts, shade) and web, no-undef on
      - run: npm run build -w web
      - run: npx playwright install --with-deps chromium firefox webkit
      # the production deployment against the live chain (first, while the RPCs' rate limits are fresh)
      - run: REPORT_DIR=playwright-report/live npx playwright test -c web/playwright.config.mjs web/e2e/live.spec.mjs --project=chromium
      # this commit's build on every engine and form factor (axe, visual snapshots, failure paths); missing snapshots are written, not failed
      - run: |
          (cd web && npx vite preview --port 4173 &) && sleep 3
          REPORT_DIR=playwright-report/ui E2E_URL=http://localhost:4173 npx playwright test -c web/playwright.config.mjs web/e2e/ui.spec.mjs --update-snapshots=missing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          retention-days: 14
          path: |
            web/playwright-report
            web/e2e/__screenshots__
      - run: node scripts/receipt-monitor.mjs --self-test
      - run: node scripts/receipt-monitor.mjs --hours 26  # covers the daily schedule with overlap; failed callback receipts / stale signing locks on testnet
      - run: node scripts/verify.mjs   # every README claim re-checked against NEAR, its MPC, its Bitcoin light client and Bitcoin
      - run: node mcp/remote-smoke.mjs
      - run: node mcp/due-diligence.mjs 1   # an agent's read-only due diligence over MCP: contract trust, reserves audit, history, loans, credit
      - run: npm run smoke -w mcp   # local MCP server; guards refuse before signing (throwaway key)
