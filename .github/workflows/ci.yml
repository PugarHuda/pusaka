name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 */6 * * *" # e2e also watches the live deployment

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: contract }
      - run: cargo test
        working-directory: contract
      - run: cargo test --features mainnet   # the mainnet build: light client, confirmations, chain allowlist
        working-directory: contract

  # NEP-330: the wasm deployed to pusaka-btc.testnet comes from here; anyone can rebuild it with
  # `cargo near verify` / the same image and compare the hash.
  reproducible-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh
      - run: cargo near build reproducible-wasm
        working-directory: contract
      - run: sha256sum contract/target/near/pusaka.wasm | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: pusaka-wasm, path: contract/target/near/pusaka.wasm }

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node shared/ckd.test.mjs   # CKD client vs near/mpc test vectors
      - run: node shared/prices.test.mjs   # LTV guard prices need two agreeing sources
      - run: node shared/esplora.test.mjs  # Bitcoin reads fail over mempool.space -> Blockstream
      - run: node shared/intents.test.mjs  # NEAR Intents exit quote: dry run only, refusals keep their reason
      - run: node api/_prices.test.mjs  # a price-source failure serves the last good answer, marked stale
      - run: node api/_relayer.test.mjs  # gas-free loan acceptance only when the contract would take it
      - run: npm run lint   # node code (api, shared, mcp, scripts, shade) and web, no-undef on
      - run: npm run build -w web
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -w web
      - run: node scripts/receipt-monitor.mjs --self-test
      - run: node scripts/receipt-monitor.mjs --hours 6   # failed callback receipts / stale signing locks on testnet
      - run: node mcp/remote-smoke.mjs
      - run: npm run smoke -w mcp   # local MCP server; guards refuse before signing (throwaway key)
