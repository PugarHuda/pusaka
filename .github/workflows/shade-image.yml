name: shade-image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [shade/agent-contract/**, shade/agent.mjs, shade/package*.json, shade/Dockerfile, shared/btc.mjs, api/_relayer.mjs]
permissions:
  contents: read
  packages: write
jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        id: push
        with: { context: ., file: shade/Dockerfile, platforms: linux/amd64, push: true, tags: "ghcr.io/pugarhuda/pusaka-agent:${{ github.sha }}" }
      - run: echo "image ghcr.io/pugarhuda/pusaka-agent@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
  agent-contract:
    # ring needs clang for wasm; easier on Ubuntu than Windows. rust-toolchain.toml pins 1.86 (near-sdk 5.26).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - run: cargo near build non-reproducible-wasm --no-abi
        working-directory: shade/agent-contract
      - uses: actions/upload-artifact@v4
        with: { name: agent-contract-wasm, path: shade/agent-contract/target/near/*.wasm }
