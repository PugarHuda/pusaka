name: shade-image
on:
  workflow_dispatch: # on demand: the running agent's image is pinned by digest in shade/docker-compose.yaml
permissions:
  contents: read
jobs:
  image:
    if: github.ref == 'refs/heads/main'
    permissions: { contents: read, packages: write }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: push
        with: { context: ., file: shade/Dockerfile, platforms: linux/amd64, push: true, tags: "ghcr.io/pugarhuda/pusaka-agent:${{ github.sha }}" }
      # the agent's modules load inside the image (a missing file crash-looped a CVM on 13 Nov)
      - run: docker run --rm --entrypoint node "ghcr.io/pugarhuda/pusaka-agent@${{ steps.push.outputs.digest }}" --input-type=module -e "await import('/app/api/_relayer.mjs'); console.log('modules load')"
      - run: echo "image ghcr.io/pugarhuda/pusaka-agent@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
  agent-contract:
    # ring needs clang for wasm; easier on Ubuntu than Windows. rust-toolchain.toml pins 1.86 (near-sdk 5.26).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # pinned: a newer cargo-near's wasm validation rejects bulk-memory ops this toolchain emits
      - run: curl --proto '=https' --tlsv1.2 -LsSf --retry 3 https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh
      - run: cargo near build non-reproducible-wasm --no-abi
        working-directory: shade/agent-contract
        env: { RUSTFLAGS: "-C target-cpu=mvp" }  # NEAR's VM: no bulk-memory ops (the runner's newer toolchain started emitting them)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: agent-contract-wasm, path: shade/agent-contract/target/near/*.wasm }
