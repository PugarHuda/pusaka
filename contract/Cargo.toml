[package]
name = "pusaka"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/PugarHuda/pusaka"

# NEP-330: `cargo near build reproducible-wasm` (CI) builds inside this pinned image and records the
# image, commit and command on-chain, so anyone can rebuild and compare with `cargo near verify`.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.96.1"
image_digest = "sha256:86bd27dd489aeb2f5004a7507d3699c045ce2f59f5287e201002966040da4a7d"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-abi"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Mainnet build: `cargo near build non-reproducible-wasm --no-abi --features mainnet`
mainnet = []

[dependencies]
near-sdk = "5"
near-contract-standards = "5"
omni-transaction = { version = "0.5", default-features = false, features = ["bitcoin", "evm"] }
bs58 = "0.5"
hex = "0.4"
base64 = "0.22"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }
proptest = "1"   # fuzz + invariant tests in src/tests.rs (dev only: not in the wasm)

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
