[package]
name = "pusaka"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Mainnet build: `cargo near build non-reproducible-wasm --no-abi --features mainnet`
mainnet = []

[dependencies]
near-sdk = "5"
near-contract-standards = "5"
omni-transaction = { version = "0.5", default-features = false, features = ["bitcoin", "evm"] }
bs58 = "0.5"
hex = "0.4"
base64 = "0.22"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
