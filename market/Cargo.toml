[package]
name = "pusaka-market"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/PugarHuda/pusaka"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Mainnet build: 24 h refinancing auctions instead of 30 min.
mainnet = []

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
